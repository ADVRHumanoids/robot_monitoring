name: Build Clients

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [ "2.0-master", "wasm_devel" ]
  pull_request:
    branches: [ "2.0-master" ]

permissions:
  contents: read

jobs:

  linux_android:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Detect tag
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "TRAVIS_TAG=$GITHUB_REF_NAME" >> $GITHUB_ENV
    - name: Retrieve the secret and decode it to a file
      env:
        MY_KEYSTORE_BASE64: ${{ secrets.MY_KEYSTORE_BASE64 }}
      run: |
        echo $MY_KEYSTORE_BASE64 | base64 --decode > my.keystore
    
    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache
    - name: Install dependencies
      run: bash travis/install_dependencies.bash
    - name: Build client
      env:
        KEYSTORE_PWD: ${{ secrets.KEYSTORE_PWD }}
      run: bash travis/build_client.bash
    - name: Upload Linux and Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-android-clients
        if-no-files-found: error
        retention-days: 7
        path: |
          build_output/xbot2_gui_client_android_arm64_v8a_signed.apk
          build_output/xbot2-gui-*-x86_64.AppImage
          build_output/xbot2-gui-*-x86_64.AppImage.sha256

  windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Initialize MSVC 2022
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64

    - name: Install Protobuf build tools
      shell: pwsh
      run: |
        $version = '33.4'
        $expectedHash = '0b31be019b9fe45a388e93bf1f16d70afdf9ce5caf958ea47892fbc868b5a1b3'
        $archive = Join-Path $env:RUNNER_TEMP "protoc-$version-win64.zip"
        $protobufPrefix = Join-Path $env:RUNNER_TEMP "protobuf-$version"
        Invoke-WebRequest `
          -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" `
          -OutFile $archive

        $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash) {
          throw "Unexpected protoc archive checksum: $actualHash"
        }

        Expand-Archive -Path $archive -DestinationPath $protobufPrefix

        # Qt's FindWrapProtoc module first looks for a protobuf CMake package
        # providing protobuf::protoc. The official binary archive has the tool
        # but no package config, so provide the minimal imported target here.
        $protobufCMakeDir = Join-Path $protobufPrefix 'lib\cmake\protobuf'
        New-Item $protobufCMakeDir -ItemType Directory -Force | Out-Null
        @'
        if(NOT TARGET protobuf::protoc)
            add_executable(protobuf::protoc IMPORTED)
            get_filename_component(_protobuf_prefix "${CMAKE_CURRENT_LIST_DIR}/../../.." ABSOLUTE)
            set_target_properties(protobuf::protoc PROPERTIES
                IMPORTED_LOCATION "${_protobuf_prefix}/bin/protoc.exe")
        endif()
        set(protobuf_FOUND TRUE)
        '@ | Set-Content (Join-Path $protobufCMakeDir 'protobuf-config.cmake') -Encoding utf8

        "CMAKE_PREFIX_PATH=$protobufPrefix;$env:CMAKE_PREFIX_PATH" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "PROTOBUF_ROOT=$protobufPrefix" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install Qt 6.11.2
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
      with:
        version: '6.11.2'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true
        setup-python: true
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        modules: >-
          qtgraphs
          qtmultimedia
          qtpositioning
          qtgrpc
          qtquick3d
          qtshadertools
          qtspeech
          qtwebchannel
          qtwebengine
          qtwebsockets
          qtwebview

    - name: Verify Qt Protobuf tools
      shell: pwsh
      run: |
        $generator = Get-ChildItem -Path $env:QT_ROOT_DIR `
          -Filter qtprotobufgen.exe -File -Recurse | Select-Object -First 1
        $protoc = Join-Path $env:PROTOBUF_ROOT 'bin\protoc.exe'

        if (-not $generator) {
          throw "Qt installation is missing qtprotobufgen.exe"
        }
        if (-not (Test-Path $protoc -PathType Leaf)) {
          throw "The Protobuf installation is missing protoc.exe"
        }

        Write-Host "Using $($generator.FullName)"
        Write-Host "Using $protoc"

    - name: Build, package, and test Windows installer
      shell: pwsh
      run: ci/windows/Build-Windows.ps1

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-client
        if-no-files-found: error
        retention-days: 7
        path: |
          build_output/xbot2-gui-*-windows-x86_64-setup.exe
          build_output/xbot2-gui-*-windows-x86_64-setup.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux_android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        path: build_output
        merge-multiple: true

    - name: Validate checksums
      working-directory: build_output
      run: sha256sum --check --strict *.sha256

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TRAVIS_TAG: ${{ github.ref_name }}
      run: bash travis/deploy_client.bash

  rolling_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/2.0-master'
    needs: [linux_android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: rolling-release
      cancel-in-progress: false

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: build_output
        merge-multiple: true

    - name: Prepare rolling asset names
      working-directory: build_output
      run: |
        set -euo pipefail

        appimage="$(find . -maxdepth 1 -type f -name 'xbot2-gui-*-x86_64.AppImage' -print -quit)"
        installer="$(find . -maxdepth 1 -type f -name 'xbot2-gui-*-windows-x86_64-setup.exe' -print -quit)"
        apk='./xbot2_gui_client_android_arm64_v8a_signed.apk'

        test -n "$appimage" && test -f "$appimage"
        test -n "$installer" && test -f "$installer"
        test -f "$apk"

        mv "$appimage" xbot2-gui-rolling-x86_64.AppImage
        mv "$installer" xbot2-gui-rolling-windows-x86_64-setup.exe
        mv "$apk" xbot2-gui-rolling-android-arm64-v8a.apk
        rm -f -- *.sha256
        sha256sum \
          xbot2-gui-rolling-x86_64.AppImage \
          xbot2-gui-rolling-windows-x86_64-setup.exe \
          xbot2-gui-rolling-android-arm64-v8a.apk \
          > xbot2-gui-rolling.sha256

    - name: Publish rolling release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        if gh release view rolling >/dev/null 2>&1; then
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling" \
            -f sha="$GITHUB_SHA" \
            -F force=true
          gh release upload rolling build_output/* --clobber
          gh release edit rolling \
            --title 'Rolling build' \
            --notes "Latest successful 2.0-master build: $GITHUB_SHA" \
            --prerelease
        else
          gh release create rolling build_output/* \
            --target "$GITHUB_SHA" \
            --title 'Rolling build' \
            --notes "Latest successful 2.0-master build: $GITHUB_SHA" \
            --prerelease
        fi
