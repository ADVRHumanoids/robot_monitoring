syntax = "proto3";

import "jointstate.proto";
import "text.proto";
import "process_output.proto";
import "theora_packet.proto";

message Message {

    int32 seq = 1;
    optional JointState jointstate = 2;
    optional Text text = 3;
    optional ProcessOutput process_output = 4;
    optional TheoraPacket theora_packet = 5;

}
