syntax = "proto3";

import "jointstate.proto";
import "text.proto";
import "process_output.proto";
import "theora_packet.proto";
import "mpeg_ts_datagram.proto";
import "pointcloud.proto";

message Message {

    int32 seq = 1;
    JointState jointstate = 2;
    Text text = 3;
    ProcessOutput process_output = 4;
    TheoraPacket theora_packet = 5;
    MpegTsDatagram mpeg_ts_datagram = 6;
    PointCloud point_cloud = 7;

}
