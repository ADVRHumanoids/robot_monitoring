context:
  session: arturo
  params:
    verbose_flag: ''

roscore:
  cmd: while true; do echo roscore; sleep 1; done
  category: core

ecat:
  cmd: while true; do echo ecat; sleep 1; done
  category: core

walking:
  cmd: while true; do echo walking; sleep 1; done
  category: control

xbot2:
  cmd: xbot2-core --hw dummy -C $(rospack find kyon_config)/kyon_basic.yaml
  variants:
    verbose:
      params:
        verbose_flag: -V
  ready_check: timeout 3 rostopic echo /xbotcore/status -n 1
  category: core

front_cam:
  cmd: rostopic echo /xbotcore/statistics
  category: sensors

back_cam:
  cmd: rostopic echo /xbotcore/joint_states
  category: sensors

lidar:
  cmd: rostopic echo /xbotcore/laser_scan
  category: sensors
  show_ui: false
